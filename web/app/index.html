<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EnvironmSafe — Procurement &amp; Finance</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }

  :root {
    --ground:#F4F6F8; --surface:#FFFFFF; --raised:#FAFBFC;
    --ink:#131A2A; --ink-2:#3D4658; --muted:#5C6579; --line:#DFE3EA; --line-2:#EEF1F5;
    --navy:#1A2744; --navy-ink:#F2F5FA; --gold:#E8A317; --gold-ink:#5A3E00;
    --s-good:#1E7A4B; --s-warn:#9A6B00; --s-crit:#B02020; --s-info:#0E5E86;
    --c-1:#0E7FA3; --c-2:#E8A317;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(19,26,42,.06), 0 8px 24px rgba(19,26,42,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0D1220; --surface:#151D2E; --raised:#1A2436;
      --ink:#E8EBF1; --ink-2:#C3CAD8; --muted:#96A1B7; --line:#263148; --line-2:#1E2739;
      --navy:#101827; --navy-ink:#EDF1F8; --gold:#F2B23F; --gold-ink:#241800;
      --s-good:#4BBE85; --s-warn:#E0B54A; --s-crit:#F08A8A; --s-info:#5EB6D8;
      --c-1:#0E7FA3; --c-2:#C08A1C;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.32);
    }
  }
  :root[data-theme="dark"] {
    --ground:#0D1220; --surface:#151D2E; --raised:#1A2436;
    --ink:#E8EBF1; --ink-2:#C3CAD8; --muted:#96A1B7; --line:#263148; --line-2:#1E2739;
    --navy:#101827; --navy-ink:#EDF1F8; --gold:#F2B23F; --gold-ink:#241800;
    --s-good:#4BBE85; --s-warn:#E0B54A; --s-crit:#F08A8A; --s-info:#5EB6D8;
    --c-1:#0E7FA3; --c-2:#C08A1C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.32);
  }
  :root[data-theme="light"] {
    --ground:#F4F6F8; --surface:#FFFFFF; --raised:#FAFBFC;
    --ink:#131A2A; --ink-2:#3D4658; --muted:#5C6579; --line:#DFE3EA; --line-2:#EEF1F5;
    --navy:#1A2744; --navy-ink:#F2F5FA; --gold:#E8A317; --gold-ink:#5A3E00;
    --s-good:#1E7A4B; --s-warn:#9A6B00; --s-crit:#B02020; --s-info:#0E5E86;
    --c-1:#0E7FA3; --c-2:#E8A317;
    --shadow:0 1px 2px rgba(19,26,42,.06), 0 8px 24px rgba(19,26,42,.07);
  }

  body { background:var(--ground); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; }
  h1,h2,h3 { margin:0; font-weight:650; letter-spacing:-.01em; }
  a { color:inherit; }

  /* ---------- app frame ---------- */
  .topbar {
    background:var(--navy); color:var(--navy-ink);
    display:flex; align-items:center; gap:.75rem; padding:.6rem .9rem;
    border-bottom:3px solid var(--gold); position:sticky; top:0; z-index:30;
  }
  .brand { display:flex; align-items:center; gap:.6rem; min-width:0; flex:1 1 auto; }
  .logo {
    width:34px; height:34px; border-radius:3px; flex:none;
    background:var(--gold); color:var(--navy);
    display:grid; place-items:center; font-weight:800; font-size:.85rem; letter-spacing:-.03em;
    background-size:cover; background-position:center;
  }
  /* the logo artwork is dark on white, so it sits on its own light chip */
  .logo.art { width:54px; height:38px; background:#fff; background-size:contain;
    background-repeat:no-repeat; background-position:center; border-radius:3px; }
  .brand-txt { min-width:0; }
  .brand-txt b { display:block; font-size:.95rem; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-txt span { display:block; font-size:.68rem; color:var(--gold); font-family:var(--mono);
    letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar .spacer { flex:0 0 auto; }
  .whoami { font-size:.75rem; color:var(--navy-ink); opacity:.85; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:11rem; }
  .topbar select, .topbar button {
    background:rgba(255,255,255,.1); color:var(--navy-ink); border:1px solid rgba(255,255,255,.22);
    border-radius:3px; padding:.35rem .5rem; font:inherit; font-size:.8rem; cursor:pointer;
    flex:0 0 auto; width:auto; max-width:9rem;
  }
  .topbar select option { color:#131A2A; background:#fff; }

  .shell { display:grid; grid-template-columns:216px minmax(0,1fr); align-items:start; }
  /* signed out: the hidden sidebar leaves its track behind, so drop to one column */
  .shell.noauth { grid-template-columns:minmax(0,1fr); }
  @media (max-width:56rem){ .shell{ grid-template-columns:minmax(0,1fr); } }

  nav.side { position:sticky; top:57px; padding:.75rem .5rem; border-right:1px solid var(--line); background:var(--surface); min-height:calc(100vh - 57px); }
  @media (max-width:56rem){
    nav.side { position:static; min-height:0; border-right:0; border-bottom:1px solid var(--line);
      display:flex; gap:.35rem; overflow-x:auto; padding:.5rem; }
    nav.side .navgroup { display:flex; gap:.35rem; }
    nav.side .navlabel { display:none; }
  }
  .navlabel { font-family:var(--mono); font-size:.65rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding:.75rem .6rem .3rem; }
  .navbtn {
    display:block; width:100%; text-align:start; background:none; border:0; color:var(--ink-2);
    font:inherit; font-size:.875rem; padding:.45rem .6rem; border-radius:3px; cursor:pointer;
    white-space:nowrap; text-decoration:none;
  }
  .navbtn:hover { background:var(--line-2); color:var(--ink); }
  .navbtn[aria-current="true"] { background:var(--navy); color:var(--navy-ink); font-weight:600; }
  .navbtn:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--c-1); outline-offset:2px; }

  main { padding:1.1rem 1.1rem 4rem; min-width:0; }
  .page-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:.5rem 1rem; margin-bottom:1rem; }
  .page-head h1 { font-size:1.35rem; }
  .page-head .sub { color:var(--muted); font-size:.85rem; }
  .page-head .grow { flex:1; }

  /* ---------- controls ---------- */
  .btn {
    background:var(--navy); color:var(--navy-ink); border:1px solid var(--navy);
    border-radius:3px; padding:.5rem .85rem; font:inherit; font-size:.85rem; font-weight:600; cursor:pointer;
  }
  .btn:hover { filter:brightness(1.12); }
  .btn.gold { background:var(--gold); border-color:var(--gold); color:var(--gold-ink); }
  .btn.ghost { background:transparent; color:var(--ink); border-color:var(--line); font-weight:500; }
  .btn.ghost:hover { background:var(--line-2); filter:none; }
  .btn.sm { padding:.3rem .55rem; font-size:.78rem; }
  .btn[disabled] { opacity:.45; cursor:not-allowed; filter:none; }

  .field { display:flex; flex-direction:column; gap:.25rem; min-width:0; }
  .field > label { font-size:.72rem; font-weight:600; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
  .field > label .ar { font-weight:400; text-transform:none; letter-spacing:0; opacity:.85; }
  input, select, textarea {
    font:inherit; font-size:.875rem; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:3px; padding:.45rem .5rem; width:100%; min-width:0;
  }
  textarea { resize:vertical; min-height:2.4rem; }
  .grid { display:grid; gap:.7rem; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
  .toolbar { display:flex; flex-wrap:wrap; gap:.5rem; align-items:end; margin-bottom:.9rem; }
  .toolbar .field { flex:1 1 150px; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); padding:1rem; }
  .card + .card { margin-top:1rem; }
  .card > h2 { font-size:1rem; margin-bottom:.75rem; }
  .card-note { font-size:.8rem; color:var(--muted); }

  /* ---------- tables ---------- */
  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:4px; background:var(--surface); }
  table { border-collapse:collapse; width:100%; font-size:.83rem; }
  th, td { padding:.45rem .6rem; text-align:start; border-bottom:1px solid var(--line-2); white-space:nowrap; }
  th { background:var(--raised); font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; position:sticky; top:0; }
  td.num, th.num { text-align:end; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  tbody tr:hover { background:var(--line-2); }
  tfoot td { font-weight:700; background:var(--raised); border-top:2px solid var(--line); }
  .empty { padding:1.5rem; text-align:center; color:var(--muted); font-size:.85rem; }

  .pill { display:inline-block; padding:.1rem .45rem; border-radius:10px; font-size:.68rem; font-weight:700;
          letter-spacing:.03em; border:1px solid currentColor; }
  .pill.draft{ color:var(--muted); } .pill.approved{ color:var(--s-info); }
  .pill.paid{ color:var(--s-good); } .pill.closed{ color:var(--ink-2); } .pill.cancelled{ color:var(--s-crit); }

  /* ---------- KPIs ---------- */
  .kpis { display:grid; gap:.7rem; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:.7rem .8rem; }
  .kpi .k { font-family:var(--mono); font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .kpi .v { font-size:1.35rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em; margin-top:.15rem; }
  .kpi .n { font-size:.72rem; color:var(--muted); }
  .kpi.good .v { color:var(--s-good); } .kpi.crit .v { color:var(--s-crit); }

  /* ---------- chart ---------- */
  .chart { width:100%; overflow-x:auto; }
  .chart svg { display:block; min-width:520px; }
  .legend { display:flex; gap:1rem; flex-wrap:wrap; font-size:.78rem; color:var(--ink-2); margin-bottom:.5rem; }
  .legend i { width:10px; height:10px; border-radius:2px; display:inline-block; margin-inline-end:.35rem; }

  /* ---------- modal ---------- */
  .modal-bg { position:fixed; inset:0; background:rgba(10,14,24,.55); display:grid; place-items:center; padding:1rem; z-index:50; }
  .modal { background:var(--surface); border:1px solid var(--line); border-radius:5px; box-shadow:var(--shadow);
           width:min(700px,100%); max-height:88vh; overflow:auto; padding:1.1rem; }
  .modal h2 { font-size:1.05rem; margin-bottom:.9rem; }
  .modal .actions { display:flex; gap:.5rem; justify-content:flex-end; margin-top:1rem; }

  .toast { position:fixed; inset-inline-end:1rem; bottom:1rem; background:var(--navy); color:var(--navy-ink);
           padding:.6rem .9rem; border-radius:4px; font-size:.85rem; box-shadow:var(--shadow); z-index:60; }

  .rowactions { display:flex; gap:.3rem; }
  .linkbtn { background:none; border:0; color:var(--c-1); font:inherit; font-size:.8rem; cursor:pointer; padding:.15rem .3rem; text-decoration:underline; }

  /* ---------- official letterhead ---------- */
  .printhead { display:none; }
  .letterhead { display:flex; align-items:center; gap:1rem; padding-bottom:.5rem; border-bottom:2px solid var(--navy); }
  .lh-logo { width:104px; height:auto; flex:none; }
  .lh-co { display:flex; flex-direction:column; gap:.1rem; min-width:0; }
  .lh-co b { font-size:1rem; }
  .lh-ar { font-size:.95rem; }
  .lh-co small { font-size:.72rem; color:var(--muted); }
  .lh-title { display:flex; flex-wrap:wrap; gap:.5rem 1rem; align-items:baseline;
    border-bottom:2px solid var(--gold); padding:.35rem 0 .4rem; margin-bottom:.7rem; }
  .lh-title b { font-size:1rem; letter-spacing:.02em; text-transform:uppercase; }
  .lh-title span { font-size:.8rem; color:var(--muted); }

  /* ---------- official document ---------- */
  .doc { background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:1.4rem; }
  .doc-meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.9rem; margin-bottom:1rem; }
  .doc-meta h3 { margin:0 0 .2rem; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); font-family:var(--mono); font-weight:500; }
  .doc-meta div p { margin:0; font-size:.85rem; }
  .doc table { margin-top:.4rem; }
  .doc td, .doc th { white-space:normal; }
  .doc .totals { margin-top:.8rem; margin-inline-start:auto; width:min(320px,100%); }
  .doc .totals td { border:0; padding:.2rem .4rem; }
  .doc .totals tr:last-child td { border-top:2px solid var(--line); font-weight:700; font-size:.95rem; }
  .doc-foot { margin-top:1.6rem; display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1.5rem; }
  .sign { border-top:1px solid var(--line); padding-top:.35rem; font-size:.78rem; color:var(--muted); }
  .doc-note { margin-top:1rem; font-size:.75rem; color:var(--muted); }
  .doc-pay { margin:.2rem 0 .9rem; font-size:.8rem; }
  .doc-pay h3 { margin:0 0 .15rem; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); font-family:var(--mono); font-weight:500; }
  .doc-pay p { margin:0; }
  @media print {
    .topbar, nav.side, .toolbar, .noprint { display:none !important; }
    .shell { display:block; }
    main { padding:0; }
    body { background:#fff; color:#000; font-size:11px; }
    .card, .tablewrap { border:0; box-shadow:none; }
    .printhead { display:flex; align-items:center; gap:.75rem; border-bottom:2px solid #1A2744; padding-bottom:.4rem; margin-bottom:.6rem; }
    .printhead .logo { background:#E8A317; color:#1A2744; }
    th { background:#eee !important; color:#000; }
    tbody tr:hover { background:none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>

<header class="topbar">
  <div class="brand">
    <div class="logo" id="logoBox">ES</div>
    <div class="brand-txt">
      <b id="coName">EnvironmSafe</b>

    </div>

  <select id="curSel" title="Currency"></select>

    <option value="ar">ع</option>

<div class="shell">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>

const randomSalt = () => {
  const a = new Uint8Array(16);
  (self.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_,i) => a[i] = Math.random()*256);
  return [...a].map(b => b.toString(16).padStart(2,"0")).join("");
};

/** SHA-256 of salt+password where available; a weaker fallback otherwise. */
async function hashPw(password, salt) {
  const bytes = new TextEncoder().encode(salt + "::" + password);
  if (self.crypto && crypto.subtle && crypto.subtle.digest) {
    const buf = await crypto.subtle.digest("SHA-256", bytes);
    return "s1:" + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
  }
  let h = 2166136261 >>> 0, out = "";
  for (let round = 0; round < 4; round++) {
    for (const b of bytes) { h ^= b; h = Math.imul(h, 16777619) >>> 0; }
    out += h.toString(16).padStart(8,"0");
  }
  return "f1:" + out;
}
async function setPassword(user, password) {
  user.salt = randomSalt();
  user.pw = await hashPw(password, user.salt);
  user.updatedAt = new Date().toISOString();
}
async function checkPassword(user, password) {
  if (!user || !user.pw) return false;
  return (await hashPw(password, user.salt)) === user.pw;
}

function saveFile(filename, content, mime = "application/json") {
  if (window.AndroidBridge && window.AndroidBridge.saveFile) {
    try { AndroidBridge.saveFile(filename, content); toast("Saved to Downloads: " + filename); return; }
    catch (e) { /* fall through */ }

/* Hands a finished file to the user. A sandboxed preview frame swallows
   <a download> without raising anything, so the button looks dead; there we
   offer a tab instead and say plainly when even that is refused. */
function deliverBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  if (EMBEDDED) {
    let w = null;
    try { w = window.open(url, "_blank", "noopener"); } catch (e) { w = null; }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast(w ? "Opened in a new tab \u2014 save the file from there." : RESTRICTED_MSG);
    return;
  }
  const a = el("a", { href:url, download:filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------- transaction maths ---------- */

const flowOf = tx => typeOf(tx.type).flow || "";
const isRevenue = tx => flowOf(tx) === "revenue";
/* Buying a fixed asset is capital expenditure, not a cost of the period: it does
   not reduce profit — depreciation does, spread over the asset's life. The money
   and the supplier balance still move exactly as before. */
const isCapital = tx => tx.isAsset === "Yes" &&
  (flowOf(tx) === "cost" || flowOf(tx) === "cost_cash_out");
const isCost    = tx => !isCapital(tx) &&
  (flowOf(tx) === "cost" || flowOf(tx) === "cost_cash_out");
/* What the supplier billed us — an asset purchase is still a debt to pay, even
   though it never touches the profit for the period. */
const isBilled  = tx => flowOf(tx) === "cost" || flowOf(tx) === "cost_cash_out";

/* Returns. A customer sending goods back reduces what we sold and what they owe;
   returning goods to a supplier reduces what we bought and what we owe them.
   A refund is the money afterwards, and settles the balance the return created. */
const isSalesReturn    = tx => flowOf(tx) === "revenue_return";
const isPurchaseReturn = tx => flowOf(tx) === "cost_return";
const isRefundOut      = tx => tx.type === "REFUND TO CUSTOMER";
const isRefundIn       = tx => tx.type === "REFUND FROM SUPPLIER";

/** Sales less what came back. */
const netRevenue = list => sum(list.filter(isRevenue), amountOf) - sum(list.filter(isSalesReturn), amountOf);
/** Purchases less what we sent back. */
const netCost    = list => sum(list.filter(isCost), amountOf) - sum(list.filter(isPurchaseReturn), amountOf);
const isCashIn  = tx => flowOf(tx) === "cash_in";
const isCashOut = tx => flowOf(tx) === "cash_out" || flowOf(tx) === "cost_cash_out";
const amountOf  = tx => num(tx.debit) + num(tx.credit);
const live      = tx => tx.status !== "Cancelled";

/* ---------- currency ----------
   Money is never added across currencies. Every row carries the currency of the
   account it moved through; rows with no account fall back to the company's
   default. A currency must be chosen to see a single set of figures, and
   "All currencies" renders one block per currency instead of one wrong total. */

const CURRENCIES = ["YER","USD","SAR","AED"];
let CUR = localStorage.getItem("environmsafe.currency") || "";

function txCurrency(tx) {
  if (tx.currency) return tx.currency;
  const a = byId("accounts", tx.accountId);
  return (a && a.currency) || CO().currency || "YER";
}
/** Currencies money has actually moved in, most used first. An account that has
    never been used does not count — otherwise the dashboard splits into blocks
    for currencies with nothing in them. */
function currenciesInUse() {
  const c = {};
  DB.transactions.filter(live).forEach(tx => { const k = txCurrency(tx); c[k] = (c[k] || 0) + 1; });
  return Object.keys(c).sort((a,b) => c[b] - c[a]);
}
/** Everything worth offering in the picker, including unused accounts. */
function currencyChoices() {
  const seen = new Set(currenciesInUse());
  rowsOf("accounts").forEach(a => { if (a.currency) seen.add(a.currency); });
  CURRENCIES.forEach(c => seen.add(c));
  return [...seen];
}
const curSuffix = () => (CUR ? " " + CUR : "");

function inRange(tx, from, to) {
  if (from && tx.date < from) return false;
  if (to && tx.date > to) return false;
  return true;
}
function txs(filter = {}) {
  const cur = filter.currency !== undefined ? filter.currency : CUR;
  return DB.transactions
    .filter(live)
    .filter(tx => !cur || txCurrency(tx) === cur)
    .filter(tx => inRange(tx, filter.from, filter.to))
    .filter(tx => !filter.customerId || tx.customerId === filter.customerId)
    .filter(tx => !filter.supplierId || tx.supplierId === filter.supplierId)
    .filter(tx => !filter.employeeId || tx.employeeId === filter.employeeId)
    .filter(tx => !filter.projectId  || tx.projectId  === filter.projectId)
    .filter(tx => !filter.accountId  || tx.accountId  === filter.accountId)
    .filter(tx => !filter.type       || tx.type       === filter.type)
    .filter(tx => !filter.status     || tx.status     === filter.status)
    .sort((a,b) => (a.date + a.id).localeCompare(b.date + b.id));
}
const sum = (list, fn) => list.reduce((s,x) => s + num(fn(x)), 0);

function accountBalance(accId, upto) {
  const acc = byId("accounts", accId); if (!acc) return 0;
  // an account holds one currency, so its own rows are always comparable
  const list = txs({ accountId:accId, to:upto, currency:"" });
  return num(acc.opening) + sum(list.filter(isCashIn), amountOf) - sum(list.filter(isCashOut), amountOf);
}
function customerBalance(cusId, upto, cur) {
  const c = byId("customers", cusId); if (!c) return 0;
  const list = txs({ customerId:cusId, to:upto, currency:cur === undefined ? CUR : cur });
  const opening = (cur === undefined ? CUR : cur) && (cur || CUR) !== (CO().currency || "YER") ? 0 : num(c.opening);
  //  invoiced − returned − received + refunded back to them
  return opening + sum(list.filter(isRevenue), amountOf)
                 - sum(list.filter(isSalesReturn), amountOf)
                 - sum(list.filter(isCashIn), amountOf)
                 + sum(list.filter(isRefundOut), amountOf);
}
function supplierBalance(supId, upto, cur) {
  const s = byId("suppliers", supId); if (!s) return 0;
  const list = txs({ supplierId:supId, to:upto, currency:cur === undefined ? CUR : cur });
  const opening = (cur === undefined ? CUR : cur) && (cur || CUR) !== (CO().currency || "YER") ? 0 : num(s.opening);
  //  billed − returned − paid + refunded back to us
  return opening + sum(list.filter(isBilled), amountOf)
                 - sum(list.filter(isPurchaseReturn), amountOf)
                 - sum(list.filter(isCashOut), amountOf)
                 + sum(list.filter(isRefundIn), amountOf);
}
/** Refundable guarantees and deposits we are holding out with someone else. */
const depositsHeld = (upto, cur) => {
  const list = txs({ to:upto, currency:cur === undefined ? CUR : cur });
  return sum(list.filter(x => typeOf(x.type).deposit === 1), amountOf) -
         sum(list.filter(x => typeOf(x.type).deposit === -1), amountOf);
};
/* ---------- fixed assets & depreciation (straight line) ---------- */

const monthsBetween = (from, to) => {
  if (!from || !to) return 0;
  const a = new Date(from), b = new Date(to);
  if (isNaN(a) || isNaN(b) || b < a) return 0;
  return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) +
         (b.getDate() >= a.getDate() ? 0 : -1);
};
const assetLive = a => ASSET_LIVE.includes(a.status || "In use");

/** Monthly charge, or 0 when the asset is not depreciated. */
function monthlyDepn(a) {
  if ((a.method || "Straight line") === "None") return 0;
  const life = num(a.lifeYears);
  if (life <= 0) return 0;
  const base = num(a.cost) - num(a.salvage);
  return base > 0 ? base / (life * 12) : 0;
}
/** Depreciation accumulated from acquisition up to `upto` (default: today). */
function accumDepn(a, upto) {
  const m = monthlyDepn(a);
  if (!m) return 0;
  const end = a.disposedOn && (!upto || a.disposedOn < upto) ? a.disposedOn : (upto || today());
  const months = monthsBetween(a.acquiredOn, end);
  return Math.min(num(a.cost) - num(a.salvage), Math.max(0, months) * m);
}
const netBookValue = (a, upto) =>
  (a.status === "Disposed" || a.status === "Sold") && (!upto || (a.disposedOn && a.disposedOn <= upto))
    ? 0 : num(a.cost) - accumDepn(a, upto);
/** Charge falling inside a reporting period. */
const depnInPeriod = (a, from, to) =>
  Math.max(0, accumDepn(a, to || today()) - (from ? accumDepn(a, from) : 0));

const totalAssetCost = upto => rowsOf("assets")
  .filter(a => !upto || !a.acquiredOn || a.acquiredOn <= upto)
  .filter(a => assetLive(a)).reduce((s,a) => s + num(a.cost), 0);
const totalNBV = upto => rowsOf("assets")
  .filter(a => !upto || !a.acquiredOn || a.acquiredOn <= upto)
  .filter(a => assetLive(a)).reduce((s,a) => s + netBookValue(a, upto), 0);
const periodDepn = (from, to) => rowsOf("assets").reduce((s,a) => s + depnInPeriod(a, from, to), 0);

const curAccounts = () => rowsOf("accounts").filter(a => !CUR || (a.currency || CO().currency) === CUR);
const totalCash = () => curAccounts().reduce((s,a) => s + accountBalance(a.id), 0);
const totalAR = () => rowsOf("customers").reduce((s,c) => s + customerBalance(c.id), 0);
const totalAP = () => rowsOf("suppliers").reduce((s,x) => s + supplierBalance(x.id), 0);

function go(view) {

  // web address the browser can open in a second tab
  if (location.hash !== "#/" + view) location.hash = "#/" + view;

function viewFromHash() {
  const id = (location.hash || "").replace(/^#\/?/, "").trim();
  return id && NAV.some(g => g.items.some(it => it.id === id)) ? id : "";
}

function render() {
  renderNav();
  if (USER) {
    // never leave the user staring at an empty screen because the chosen
    // currency holds nothing while their data sits in another one
    const inUse = currenciesInUse();
    if (CUR && inUse.length && !inUse.includes(CUR)) {
      CUR = inUse[0];
      localStorage.setItem("environmsafe.currency", CUR);
    }
    fillCurrencySelect();
  }
  const m = $("#main"); m.innerHTML = "";
  if (VIEW === "dashboard") viewDashboard(m);
  else if (VIEW === "daily") viewDaily(m);
  else if (VIEW === "ledger") viewLedger(m);
  else if (VIEW === "cases") viewCases(m);
  else if (VIEW.startsWith("m_")) viewMaster(m, VIEW.slice(2));
  else if (VIEW.startsWith("r_")) viewReport(m, VIEW.slice(2));
  else if (VIEW === "company") viewCompany(m);
  else if (VIEW === "data") viewData(m);
}

function barChart(data) {
  const W = Math.max(520, data.length * 96), H = 220, pad = { t:14, r:12, b:34, l:64 };
  const max = Math.max(1, ...data.flatMap(d => [d.rev, d.cst]));
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const bw = Math.min(26, (iw / data.length - 10) / 2);
  const y = v => pad.t + ih - (v / max) * ih;
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const yy = pad.t + ih - (ih * i / 4);
    g += `<line x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>
          <text x="${pad.l-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)"
            font-family="var(--mono)">${fmt0(max*i/4)}</text>`;
  }
  data.forEach((d,i) => {
    const cx = pad.l + (iw / data.length) * (i + .5);
    [[d.rev,"var(--c-1)",-1],[d.cst,"var(--c-2)",1]].forEach(([v,col,dir]) => {
      const h = Math.max(2, (v / max) * ih), x = cx + (dir < 0 ? -bw-1 : 1);
      g += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${h}" fill="${col}" rx="4" ry="4"><title>${
        esc(d.mo)}: ${fmt0(v)}</title></rect>`;
      if (v > 0) g += `<text x="${x+bw/2}" y="${y(v)-4}" text-anchor="middle" font-size="9.5"
        fill="var(--ink-2)" font-family="var(--mono)">${fmt0(v)}</text>`;
    });
    g += `<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(d.mo)}</text>`;
  });
  const box = el("div", { class:"chart" });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="Revenue versus cost by month">${g}</svg>`;
  return box;
}
function trendTable(data) {
  const wrap = el("div", { class:"tablewrap" }); wrap.style.marginTop = ".7rem";
  wrap.innerHTML = `<table><thead><tr><th>Month</th><th class="num">Revenue</th>
    <th class="num">Cost</th><th class="num">Margin</th></tr></thead><tbody>${
    data.map(d => `<tr><td>${esc(d.mo)}</td><td class="num">${fmt0(d.rev)}</td>
      <td class="num">${fmt0(d.cst)}</td><td class="num">${fmt0(d.rev - d.cst)}</td></tr>`).join("")
    }</tbody></table>`;

}
function topList(title, items) {

/* -------------------------------------------------------------------------
   Duplicate guard — the same bill reaches the office twice, two people enter
   the same payment, or Save is tapped twice on a slow phone. Before a new
   transaction is written we look for one already recorded that looks like it,
   show what was found and let the user decide. Nothing is ever blocked.
   ------------------------------------------------------------------------- */

const DUP_DAYS = 3;              // how far apart two entries can be and still look alike
const DUP_AMOUNT_TOLERANCE = 1;  // percent — covers rounding and small fee differences

const dayDiff = (a, b) => {
  const x = new Date(a + "T00:00:00").getTime(), y = new Date(b + "T00:00:00").getTime();
  return (isNaN(x) || isNaN(y)) ? null : Math.abs(x - y) / 86400000;
};
const sameParty = (a, b) =>
  (a.customerId || "") === (b.customerId || "") &&
  (a.supplierId || "") === (b.supplierId || "") &&
  (a.employeeId || "") === (b.employeeId || "");
const closeAmount = (a, b) => {
  if (a <= 0 || b <= 0) return a === b;
  return Math.abs(a - b) <= Math.max(a, b) * DUP_AMOUNT_TOLERANCE / 100;
};

/** Transactions already recorded that look like `cand`, most recent first. */
function similarTransactions(cand, list) {
  list = list || DB.transactions;
  const ref = (cand.refNo || "").trim().toLowerCase();
  const amount = num(cand.amount);
  return list.filter(x => {
    if (!x || x.id === cand.id) return false;                      // never match itself
    // Same reference number is a duplicate on its own — that is what a reference is for.
    if (ref && (x.refNo || "").trim().toLowerCase() === ref) return true;
    if (x.type !== cand.type) return false;
    if (!sameParty(x, cand)) return false;
    if (!closeAmount(amountOf(x), amount)) return false;
    const dd = dayDiff(x.date, cand.date);
    return dd !== null && dd <= DUP_DAYS;
  }).sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
}

/** The confirm() text for a near-duplicate — "" when nothing looks similar. */
function duplicateTxWarning(cand, list) {
  const dups = similarTransactions(cand, list);
  if (!dups.length) return "";
  const d = dups[0];
  const party = nameOf("customers", d.customerId) || nameOf("suppliers", d.supplierId)
             || nameOf("employees", d.employeeId) || "";
  const line = [d.id, d.date, d.type, fmt(amountOf(d)) + " " + (d.currency || ""), party,
                d.refNo ? "Ref " + d.refNo : ""].filter(Boolean).join(" · ");
  const ar = LANG === "ar";
  let msg = (ar ? "\u26a0\ufe0f توجد حركة مشابهة مسجّلة بالفعل:\n" : "\u26a0\ufe0f A similar transaction is already recorded:\n") + line;
  if (dups.length > 1)
    msg += ar ? `\n(ويوجد ${dups.length - 1} إدخال قريب آخر)` : `\n(and ${dups.length - 1} other close entry/entries)`;
  return msg + (ar ? "\n\nهل تريد المتابعة والحفظ على أي حال؟"
                   : "\n\nDo you want to continue and save it anyway?");
}

/** Purchase-side transactions are the ones that can bring an asset into the company. */
const isPurchase = type => ["INVOICE IN","EXPENSE","PAYMENT OUT"].includes(type);

/** Creates the asset register entry behind a purchase marked as a fixed asset. */
function registerAssetFrom(tx, f) {
  const it = byId("items", tx.itemId);
  const now = new Date().toISOString();
  const asset = {
    id: nextId("AST"),
    tag: (f.assetTag || "").trim(),
    nameEn: it ? it.nameEn : (f.notes || "Asset from " + tx.id),
    nameAr: it ? it.nameAr || "" : "",

    itemId: tx.itemId || "",
    serial: (f.assetTag || "").trim(),
    location: (f.assetLocation || "").trim(),
    supplierId: tx.supplierId || "",
    acquiredOn: tx.date,

    method: "Straight line",
    status: "In use",
    source: "Purchased",

  };
  DB.assets.push(asset);

}

    { k:"docRef", l:"Document file / link", v:tx.docRef },
    { k:"notes", l:"Notes", t:"textarea", v:tx.notes }
  ], vals => {

function editMaster(tbl, id) {
  if (!canEdit()) return toast("Your role is read-only.");
  if (tbl === "users" && !isAdmin()) return toast("Only an Administrator can manage users.");
  const S = SCHEMAS[tbl];
  const rec = id ? byId(tbl, id) : null;
  const fields = S.fields.map(f => Object.assign({}, f, { v: rec ? rec[f.k] : "" }));
  if (tbl === "users" && !rec) fields.push({ k:"password", l:"Password (at least 6 characters)", t:"password", req:true });
  modal((rec ? t("edit") : t("add")) + " — " + S.en, fields, async vals => {
    if (!vals.nameEn) return toast("Name is required.");
    const now = new Date().toISOString();
    if (tbl === "users") {
      const clash = userByName(vals.username);
      if (!vals.username) return toast("A username is required.");
      if (clash && (!rec || clash.id !== rec.id)) return toast("That username is already taken.");
      if (!rec && (vals.password || "").length < 6) return toast("Use at least 6 characters.");
      if (rec && rec.id === (USER || {}).id && vals.role !== "Administrator")
        return toast("You cannot remove your own Administrator role.");
    }
    const password = vals.password; delete vals.password;
    if (rec) { Object.assign(rec, vals, { updatedAt:now }); }
    else {
      const row = Object.assign({ id:nextId(S.prefix), createdAt:now, updatedAt:now }, vals);
      if (tbl === "users") {
        row.active = row.active || "Yes";
        // the administrator knows this password, so the user picks their own on first sign-in
        row.mustChange = "Yes";
        await setPassword(row, password);
      }
      DB[tbl].push(row);
    }
    save(); render(); toast("Saved");
  });
}

function resetPassword(id) {
  if (!isAdmin()) return toast("Only an Administrator can reset passwords.");
  const u = byId("users", id); if (!u) return;
  modal(`Set password — ${u.nameEn}`, [
    { k:"p1", l:"New password", t:"password", req:true },
    { k:"p2", l:"Repeat new password", t:"password", req:true }
  ], async vals => {
    if (vals.p1.length < 6) return toast("Use at least 6 characters.");
    if (vals.p1 !== vals.p2) return toast("The two passwords do not match.");
    await setPassword(u, vals.p1);
    u.mustChange = u.id === (USER || {}).id ? "No" : "Yes";
    save(); render(); toast(`Password set for ${u.username}`);
  });
}

function exportMasterCsv(tbl) {
  const S = SCHEMAS[tbl];
  const cols = ["id", ...S.fields.map(f => f.k)];

}

function importMasterCsv(tbl) {
  const S = SCHEMAS[tbl];
  const inp = el("input", { type:"file", accept:".csv,text/csv" });
  inp.onchange = () => {
    const file = inp.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const rows = parseCsv(String(rd.result));
        if (rows.length < 2) return toast("The file has no data rows.");
        const head = rows[0].map(h => h.trim());
        const keys = S.fields.map(f => f.k);
        const map = head.map(h => {
          const hit = keys.find(k => k.toLowerCase() === h.toLowerCase()) ||
                      (/name/i.test(h) && !/arab/i.test(h) ? "nameEn" : "") ||
                      (/arab/i.test(h) ? "nameAr" : "") ||
                      (/phone|mobile|tel/i.test(h) ? "phone" : "") ||
                      (/mail/i.test(h) ? "email" : "") ||
                      (/address|location/i.test(h) ? "address" : "") ||
                      (/contact|person/i.test(h) ? "contact" : "");
          return hit || null;
        });
        let n = 0; const now = new Date().toISOString();
        rows.slice(1).forEach(r => {
          const rec = {}; map.forEach((k,i) => { if (k) rec[k] = (r[i] || "").trim(); });
          if (!rec.nameEn) return;
          DB[tbl].push(Object.assign({ id:nextId(S.prefix), createdAt:now, updatedAt:now }, rec)); n++;
        });
        save(); render(); toast(`Imported ${n} records`);
      } catch (e) { toast("Could not read that CSV file."); }
    };
    rd.readAsText(file);
  };
  inp.click();
}
function parseCsv(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ""));
}

/* =========================================================================
   Printing and exporting
   Android's WebView does not implement window.print(), and an embedded preview
   frame blocks it, so printing goes through the host app when it is there and
   says so plainly when the surface will not allow it.
   ========================================================================= */

const EMBEDDED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

const RESTRICTED_MSG = "Printing and file downloads are blocked in this preview. " +
  "Open the system at its own web address, or use the Android app.";

/* Tells the user once, up front, that this surface cannot print or download —
   far better than letting them press the buttons and conclude the app is broken. */
function previewBanner() {
  if (!EMBEDDED || document.getElementById("previewBanner")) return;
  const b = el("div", { id:"previewBanner", class:"noprint",
    style:"background:var(--s-warn);color:#fff;font-size:.8rem;padding:.45rem .9rem;text-align:center" },
    RESTRICTED_MSG);
  const bar = document.querySelector(".topbar");
  if (bar && bar.parentNode) bar.parentNode.insertBefore(b, bar.nextSibling);
}

function doPrint(jobName) {
  const name = (jobName || "EnvironmSafe report").replace(/[^\w .-]/g, " ").trim();
  if (window.AndroidBridge && window.AndroidBridge.printPage) {
    try { AndroidBridge.printPage(name); return; } catch (e) { /* fall through */ }
  }
  // A sandboxed preview frame blocks the print dialogue outright: window.print()
  // returns having opened nothing, which reads as a broken button. In a real tab
  // or inside the APK this branch never runs.
  if (EMBEDDED) {
    let w = null;
    try { w = window.open(location.href, "_blank", "noopener"); } catch (e) { w = null; }
    toast(w ? "Opened in a new tab \u2014 print from there." : RESTRICTED_MSG);
    return;
  }
  try { window.print(); } catch (e) {
    toast("This browser would not open the print dialogue. Use Download Excel instead.");
  }
}

/** Whatever report is on screen, as a spreadsheet — headings, tables and totals. */
function reportToXlsx(titleText) {
  const c = CO();
  const head = document.querySelector(".page-head h1");
  const title = titleText || (head ? head.textContent.trim() : "Report");
  const rows = [];
  rows.push([{ v:c.name, s:2 }]);
  if (c.addressLine || c.address) rows.push([c.addressLine || c.address]);
  rows.push([[c.email, c.phone].filter(Boolean).join("  ·  ")]);
  rows.push([]);
  rows.push([{ v:title, s:1 }]);
  rows.push([`Period: ${rep.from || "start"} → ${rep.to || today()}`]);
  if (CUR) rows.push([`Currency: ${CUR}`]);
  rows.push([]);

  let widest = 3;
  document.querySelectorAll("#main h2, #main table").forEach(node => {
    if (node.tagName === "H2") {
      rows.push([]);
      rows.push([{ v:node.textContent.trim(), s:2 }]);
      return;
    }
    node.querySelectorAll("tr").forEach(tr => {
      const cells = [];
      Array.from(tr.children).forEach(td => {
        if (td.classList.contains("noprint")) return;
        const text = td.textContent.replace(/\s+/g, " ").trim();
        const isHead = td.tagName === "TH";
        const n = parseFloat(text.replace(/,/g, ""));
        if (td.classList.contains("num") && text !== "" && isFinite(n) && !isHead)
          cells.push({ v:n, s:5, num:true });
        else if (isHead) cells.push({ v:text, s:4 });
        else cells.push(text);
      });
      if (cells.length) { rows.push(cells); widest = Math.max(widest, cells.length); }
    });
    rows.push([]);
  });

  const widths = Array.from({ length: widest }, (_, i) => (i === 1 ? 34 : i === 0 ? 14 : 16));
  const stamp = today();
  saveXlsx(`${title.replace(/[^\w -]/g, "").trim() || "report"} ${stamp}.xlsx`,
           title.slice(0, 28), rows, { widths });
}

/* =========================================================================
   Excel export — a real .xlsx written here, so the official form arrives as a
   spreadsheet as well as a PDF. Store-only ZIP, inline strings, a few styles.
   ========================================================================= */

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/** Minimal ZIP container: no compression, which keeps this short and valid. */
function zipFiles(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const u16 = n => [n & 0xFF, (n >>> 8) & 0xFF];
  const u32 = n => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];

  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.data);
    const crc = crc32(data);
    const local = [...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
                   ...u32(crc), ...u32(data.length), ...u32(data.length),
                   ...u16(name.length), ...u16(0)];
    chunks.push(new Uint8Array(local), name, data);
    central.push({ name, crc, size: data.length, offset });
    offset += local.length + name.length + data.length;
  });

  const dir = [];
  central.forEach(e => {
    dir.push(...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
             ...u32(e.crc), ...u32(e.size), ...u32(e.size), ...u16(e.name.length),
             ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(e.offset));
    dir.push(...e.name);
  });
  const dirBytes = new Uint8Array(dir);
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0),
                              ...u16(central.length), ...u16(central.length),
                              ...u32(dirBytes.length), ...u32(offset), ...u16(0)]);
  const total = chunks.reduce((n, c) => n + c.length, 0) + dirBytes.length + end.length;
  const out = new Uint8Array(total);
  let at = 0;
  chunks.forEach(c => { out.set(c, at); at += c.length; });
  out.set(dirBytes, at); at += dirBytes.length;
  out.set(end, at);
  return out;
}

const xmlEsc = v => String(v ?? "").replace(/[&<>"']/g, ch =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&apos;" }[ch]));
const colName = n => { let s = ""; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - 1 - m) / 26; } return s; };

/** rows: array of arrays of {v, s, num} — s is a style index into the sheet below. */
function sheetXml(rows, opts = {}) {
  const body = rows.map((cells, r) => {
    const cs = cells.map((c, i) => {
      if (c === null || c === undefined || c === "") return "";
      const cell = typeof c === "object" ? c : { v: c };
      const ref = colName(i) + (r + 1);
      const st = cell.s ? ` s="${cell.s}"` : "";
      return cell.num
        ? `<c r="${ref}"${st}><v>${num(cell.v)}</v></c>`
        : `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(cell.v)}</t></is></c>`;
    }).join("");
    return `<row r="${r + 1}">${cs}</row>`;
  }).join("");
  const cols = (opts.widths || []).map((w, i) =>
    `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("");
  const merges = (opts.merges || []).length
    ? `<mergeCells count="${opts.merges.length}">${opts.merges.map(m => `<mergeCell ref="${m}"/>`).join("")}</mergeCells>`
    : "";
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>
${cols ? `<cols>${cols}</cols>` : ""}<sheetData>${body}</sheetData>${merges}
<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>
<pageSetup orientation="portrait" fitToWidth="1"/></worksheet>`;
}

function buildXlsx(sheetName, rows, opts) {
  const files = [
    { name: "[Content_Types].xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>` },
    { name: "_rels/.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` },
    { name: "xl/workbook.xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="${xmlEsc(sheetName).slice(0,30)}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: "xl/_rels/workbook.xml.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>` },
    { name: "xl/styles.xml", data: STYLES_XML },
    { name: "xl/worksheets/sheet1.xml", data: sheetXml(rows, opts) }
  ];
  return zipFiles(files);
}

function saveXlsx(filename, sheetName, rows, opts) {
  const bytes = buildXlsx(sheetName, rows, opts);
  if (window.AndroidBridge && window.AndroidBridge.saveBytes) {
    let bin = "";
    bytes.forEach(b => { bin += String.fromCharCode(b); });
    try { AndroidBridge.saveBytes(filename, btoa(bin)); toast("Saved " + filename); return; }
    catch (e) { /* fall through to a browser download */ }
  }
  // Goes through deliverBlob so a sandboxed preview reports the block instead of
  // dropping the file on the floor — the same path every other download uses.
  deliverBlob(filename, new Blob([bytes],
    { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
}

/** The official document as a spreadsheet, laid out like the paper form. */
function documentToXlsx(lines, refNo) {
  const c = CO(), head = lines[0], ex = docExtras(refNo);
  const title = (DOC_TITLE[head.type] || head.type).toUpperCase();
  const isQuote = head.type === "QUOTATION OUT";
  const party = head.customerId ? byId("customers", head.customerId)
              : head.supplierId ? byId("suppliers", head.supplierId) : null;
  const t2 = docTotals(lines, ex);
  const cur = txCurrency(head);
  const B = v => ({ v, s:2 });
  const L = v => ({ v, s:3 });
  const H = v => ({ v, s:4 });
  const N = v => ({ v, s:5, num:true });

  const rows = [];
  rows.push([B(c.name), "", "", "", "", "", { v:title, s:1 }]);
  rows.push([c.addressLine || c.address || "", "", "", "", "", L(`${title} #`), refNo]);
  rows.push([`Mobile: ${c.phone || ""}${c.phone2 ? " - " + c.phone2 : ""}`, "", "", "", "", L("DATE"), head.date]);
  rows.push([c.email || "", "", "", "", "", L("CURRENCY"), cur]);
  rows.push([]);
  rows.push([L("BILL TO"), "", "", "", "", L("CUSTOMER ID"), ex.customerRef || (party ? party.id : "")]);
  rows.push([party ? party.contact || "" : "", "", "", "", "", L("TERMS"), ex.terms || c.terms || ""]);
  rows.push([party ? party.nameEn : "", "", "", "", "",
             isQuote ? "" : L("PO NO"), isQuote ? "" : (ex.poNo || "NA")]);
  rows.push([party ? party.address || "" : ""]);
  rows.push([party ? party.phone || "" : ""]);
  if (!isQuote && c.payVia) {
    rows.push([]);
    rows.push([L("PAYMENT VIA")]);
    String(c.payVia).split("\n").forEach(line => rows.push([line]));
  }
  rows.push([]);
  rows.push([H("SN"), H("DESCRIPTION"), H("UNIT"), H("QTY"), H("UNIT PRICE"), H("DISCOUNT"), H("AMOUNT")]);
  lines.forEach((x, i) => {
    const it = byId("items", x.itemId);
    rows.push([{ v:i + 1, s:7 }, { v:it ? it.nameEn : (x.notes || x.type), s:7 },
               { v:it ? it.unit || "" : "", s:7 },
               N(x.qty || ""), N(x.unitPrice || ""), N(x.discount || ""), N(amountOf(x))]);
  });
  rows.push([]);
  const totalRow = (label, value) => rows.push(["", "", "", "", B(label), "", { v:value, s:6, num:true }]);
  totalRow("SUBTOTAL", t2.subtotal);
  if (t2.discount) totalRow("DISCOUNT", t2.discount);
  if (t2.rate) totalRow(`VAT @ ${t2.rate}%`, t2.vat);
  else rows.push(["", "", "", "", B("TAX RATE"), "", "not involved"]);
  if (t2.shipping) totalRow("SHIPPING COST", t2.shipping);
  totalRow(`TOTAL ${cur}`, t2.total);
  rows.push([]);
  if (isQuote && (ex.validity || c.validity)) rows.push([ex.validity || c.validity]);
  if (ex.delivery || c.delivery) rows.push([ex.delivery || c.delivery]);
  if (ex.note) rows.push([ex.note]);
  rows.push([]);
  rows.push([L("Prepared by"), "", L("Approved by"), "", L("Received by / stamp")]);
  rows.push([head.createdBy || ""]);
  rows.push([]);
  rows.push([B(c.footer || c.name)]);

  saveXlsx(`${refNo || title}.xlsx`, title.slice(0, 28), rows,
    { widths:[6, 40, 8, 10, 14, 12, 14] });
}

function repItems(m) {

  }
  const period = txs({ from:rep.from, to:rep.to });
  const rows = list.map(it => {
    const mine = period.filter(x => x.itemId === it.id);
    const sold   = mine.filter(x => x.type === "INVOICE OUT");
    const bought = mine.filter(x => x.type === "INVOICE IN");
    const quoted = mine.filter(x => x.type === "QUOTATION OUT");
    // quantities and values are net of what came back
    const backIn  = mine.filter(isSalesReturn);
    const backOut = mine.filter(isPurchaseReturn);
    const qSold   = sum(sold, x => x.qty) - sum(backIn, x => x.qty);
    const qBought = sum(bought, x => x.qty) - sum(backOut, x => x.qty);
    const rev  = sum(sold, amountOf) - sum(backIn, amountOf);
    const cost = sum(bought, amountOf) - sum(backOut, amountOf);
    return { it, quoted:quoted.length, qSold, qBought, rev, cost,
             avg: qSold ? rev / qSold : 0, profit: rev - cost };

  m.appendChild(w);

  /* movement detail for a single selected item */

        <td>${esc(x.refNo || "")}</td><td class="num">${x.qty ? fmt(x.qty) : ""}</td>
        <td class="num">${x.unitPrice ? fmt(x.unitPrice) : ""}</td>

/** Per-document extras that are not part of any single line. */
const docExtras = ref => Object.assign(
  { terms:"", poNo:"", customerRef:"", validity:"", delivery:"",
    discount:0, shipping:0, taxRate:"", note:"" },
  (DB.meta.docs || {})[ref] || {});

function saveDocExtras(ref, vals) {
  DB.meta.docs = DB.meta.docs || {};

}

/** Subtotal, discount, tax, shipping and total, exactly as the paper form adds up. */
function docTotals(lines, ex) {
  const subtotal = sum(lines, amountOf);
  const discount = num(ex.discount);
  const taxable  = subtotal - discount;
  const rate     = num(ex.taxRate);
  const vat      = rate > 0 ? taxable * rate / 100 : 0;
  const shipping = num(ex.shipping);
  return { subtotal, discount, taxable, rate, vat, shipping, total: taxable + vat + shipping };
}

function repParty(m, tbl) {
  const isCus = tbl === "customers";
  const list = rep.entity ? [byId(tbl, rep.entity)].filter(Boolean) : rowsOf(tbl);
  if (!list.length) { m.appendChild(el("div", { class:"card" }, `<div class="empty">${esc(t("none"))}</div>`)); return; }
  list.forEach(p => {
    const key = isCus ? "customerId" : "supplierId";
    const all = txs({ [key]:p.id });
    const before = all.filter(x => rep.from && x.date < rep.from);
    // charges raise the balance, settlements lower it; a return is a settlement,
    // a refund undoes one
    const charge  = x => isCus ? (isRevenue(x) || isRefundOut(x)) : (isBilled(x) || isRefundIn(x));
    const settle  = x => isCus ? (isCashIn(x) || isSalesReturn(x)) : (isCashOut(x) || isPurchaseReturn(x));
    const relevant = x => charge(x) || settle(x);
    const opening = num(p.opening) +
      sum(before.filter(charge), amountOf) - sum(before.filter(settle), amountOf);
    const period = all.filter(x => inRange(x, rep.from, rep.to)).filter(relevant);
    let run = opening;
    const body = period.map(x => {
      const up = charge(x);
      const amt = amountOf(x);
      run += up ? amt : -amt;
      const ret = isSalesReturn(x) || isPurchaseReturn(x);
      return `<tr><td>${esc(x.date)}</td><td>${esc(x.type)}${
          ret && x.againstRef ? ` <small>vs ${esc(x.againstRef)}</small>` : ""}</td>
        <td>${esc(x.refNo || "")}</td>
        <td>${esc(x.caseNo || "")}</td>
        <td class="num">${up ? fmt(amt) : ""}</td><td class="num">${up ? "" : fmt(amt)}</td>
        <td class="num">${fmt(run)}</td></tr>`;
    }).join("");
    const card = el("div", { class:"card" });
    card.appendChild(el("h2", {}, esc(p.nameEn) + (p.nameAr ? " — " + p.nameAr : "")));
    card.appendChild(el("div", { class:"card-note" },
      `${esc(p.phone || "")} ${esc(p.email || "")} · ${esc(t("opening"))}: ${fmt(opening)}`));
    const w = el("div", { class:"tablewrap" }); w.style.marginTop = ".6rem";
    w.innerHTML = `<table><thead><tr><th>${esc(t("date"))}</th><th>${esc(t("type"))}</th>
      <th>${esc(t("ref"))}</th><th>Case</th>
      <th class="num">${isCus ? "Invoiced" : "Billed"}</th>
      <th class="num">${isCus ? "Received / returned" : "Paid / returned"}</th>
      <th class="num">${esc(t("balance"))}</th></tr></thead>
      <tbody><tr><td colspan="6">${esc(t("opening"))}</td><td class="num">${fmt(opening)}</td></tr>
      ${body || ""}</tbody>
      <tfoot><tr><td colspan="4">${esc(t("closing"))}</td>
        <td class="num">${fmt(sum(period.filter(charge), amountOf))}</td>
        <td class="num">${fmt(sum(period.filter(settle), amountOf))}</td>
        <td class="num">${fmt(run)}</td></tr></tfoot></table>`;
    card.appendChild(w);
    m.appendChild(card);
  });
}

function repProject(m) {

  w.innerHTML = `<table><thead><tr><th>Project</th><th>Customer</th><th>Status</th>
    <th class="num">Contract</th><th class="num">Revenue</th><th class="num">Cost</th>
    <th class="num">Profit</th><th class="num">Margin</th></tr></thead><tbody>${rows}</tbody></table>`;

}

function repBank(m) {
  const list = rep.entity ? [byId("accounts", rep.entity)].filter(Boolean) : curAccounts();
  list.forEach(a => {
    const all = txs({ accountId:a.id });
    const before = all.filter(x => rep.from && x.date < rep.from);

    card.appendChild(w);
    m.appendChild(card);

function viewCompany(m) {

  pageHead(m, t("company"), "Printed at the head of every report and document");
  const c = CO();
  const card = el("div", { class:"card" });
  const form = el("form");
  const g = el("div", { class:"grid" });
  CO_FIELDS.forEach(f => g.appendChild(fld(f.l, `<input name="${f.k}" value="${esc(c[f.k] || "")}">`)));

  const mkImport = (mode, label, cls) => {
    const b = el("button", { class:"btn " + cls, style:"margin-inline-end:.5rem" }, label);
    b.onclick = () => {
      if (!canEdit()) return toast("Your role is read-only.");
      const inp = el("input", { type:"file", accept:".json,application/json" });
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          let incoming;
          try { incoming = JSON.parse(String(rd.result)); }
          catch (e) { return toast("That is not a valid backup file."); }
          if (!incoming || !incoming.transactions) return toast("That file has no EnvironmSafe data.");
          if (mode === "replace") {
            if (!confirm("Replace ALL data on this device?")) return;
            DB = Object.assign(blankDb(), incoming);
          } else {
            const added = mergeDb(incoming);
            toast(`Merged — ${added} new or updated records`);
          }
          save(); render();
        };
        rd.readAsText(f);
      };
      inp.click();
    };
    return b;
  };
  c2.appendChild(mkImport("merge","Merge a backup","gold"));
  c2.appendChild(mkImport("replace","Replace all data","ghost"));
  m.appendChild(c2);

  const c3 = el("div", { class:"card" });
  c3.innerHTML = `<h2>Export for Excel</h2>
    <p class="card-note">CSV files open directly in Excel.</p>`;
  const box = el("div", { style:"display:flex;flex-wrap:wrap;gap:.4rem" });
  const b3 = el("button", { class:"btn ghost sm" }, "Transactions");
  b3.onclick = exportTransactionsCsv; box.appendChild(b3);
  Object.keys(SCHEMAS).forEach(k => {
    const b = el("button", { class:"btn ghost sm" }, SCHEMAS[k].en);
    b.onclick = () => exportMasterCsv(k); box.appendChild(b);
  });
  c3.appendChild(box);
  m.appendChild(c3);

  const c4 = el("div", { class:"card" });
  const counts = ["users","items","assets","customers","suppliers","employees","projects","accounts","categories","transactions"]
    .map(k => `<tr><td>${esc(k)}</td><td class="num">${rowsOf(k).length}</td></tr>`).join("");
  c4.innerHTML = `<h2>This device</h2><div class="tablewrap"><table><tbody>${counts}
    <tr><td>Device ID</td><td class="num">${esc(DB.meta.device || "")}</td></tr></tbody></table></div>`;
  const b4 = el("button", { class:"btn ghost sm", style:"margin-top:.7rem" }, "Erase everything on this device");
  b4.onclick = async () => {
    if (!isAdmin()) return toast("Only an Administrator can erase the device.");
    if (confirm("Erase all data on this device? Export a backup first.")) {
      DB = blankDb(); seed(DB); await ensureAdmin(); save();
      sessionStorage.removeItem(SESSION_KEY);
      toast("Device cleared"); loginScreen();
    }
  };
  c4.appendChild(b4);
  m.appendChild(c4);
}

function mergeDb(incoming) {
  let n = 0;
  const tables = ["users","items","assets","customers","suppliers","employees","projects","accounts","categories","transactions"];
  tables.forEach(tbl => {
    (incoming[tbl] || []).forEach(r => {
      if (!r || !r.id) return;
      const mine = (DB[tbl] || []).find(x => x.id === r.id);
      if (!mine) { DB[tbl].push(r); n++; }
      else if ((r.updatedAt || "") > (mine.updatedAt || "")) { Object.assign(mine, r); n++; }
    });
    // keep the ID counter ahead of anything that arrived
    (DB[tbl] || []).forEach(r => {
      const mm = /^([A-Z]+)-(\d+)$/.exec(r.id || "");
      if (mm) DB.meta.seq[mm[1]] = Math.max(DB.meta.seq[mm[1]] || 0, parseInt(mm[2],10));
    });
  });
  return n;
}

/* =========================================================================
   Generic modal form
   ========================================================================= */

function modal(title, fields, onSave) {
  const bg = el("div", { class:"modal-bg" });
  const box = el("div", { class:"modal" });
  box.appendChild(el("h2", {}, esc(title)));
  const form = el("form");
  const g = el("div", { class:"grid" });
  fields.forEach(f => {
    let inner;
    const v = f.v ?? "";
    if (f.t === "textarea") inner = `<textarea name="${f.k}" rows="2">${esc(v)}</textarea>`;
    else if (f.t === "select") inner = `<select name="${f.k}">${["", ...(f.opts || [])].map(o =>
      `<option ${String(o) === String(v) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    else if (f.t === "ref") inner = refSelect(f.k, f.ref, v);
    else inner = `<input type="${f.t || "text"}" ${f.t === "number" ? 'step="0.01"' : ""}
      name="${f.k}" value="${esc(v)}" ${f.req ? "required" : ""}>`;
    g.appendChild(fld(f.l, inner));
  });
  form.appendChild(g);
  const act = el("div", { class:"actions" });
  const cancel = el("button", { class:"btn ghost", type:"button" }, t("cancel"));
  cancel.onclick = () => bg.remove();
  act.appendChild(cancel);
  act.appendChild(el("button", { class:"btn gold", type:"submit" }, t("save")));
  form.appendChild(act);
  form.onsubmit = e => {
    e.preventDefault();
    const vals = Object.fromEntries(new FormData(form).entries());
    bg.remove();
    onSave(vals);
  };
  box.appendChild(form);
  bg.appendChild(box);
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
  const first = box.querySelector("input,select,textarea"); if (first) first.focus();
}

/* =========================================================================
   Boot
   ========================================================================= */

function applyChrome() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  $("#coName").textContent = LANG === "ar" ? "إنفايرومسيف" : "EnvironmSafe";
  $("#coTag").textContent = LANG === "ar" ? "المشتريات والمالية" : "Procurement & Finance";
  const logo = CO().logo;
  const box = $("#logoBox");
  if (logo) {
    box.textContent = ""; box.classList.add("art");
    box.style.backgroundImage = `url(${logo})`;
  }
}

$("#langSel").value = LANG;
$("#langSel").onchange = e => {
  LANG = e.target.value; localStorage.setItem("environmsafe.lang", LANG);
  applyChrome(); if (USER) render(); else loginScreen();
};
$("#acctBtn").onclick = accountMenu;

function fillCurrencySelect() {
  const list = currencyChoices();
  $("#curSel").innerHTML = `<option value="">All currencies</option>` +
    list.map(c => `<option value="${esc(c)}" ${c === CUR ? "selected" : ""}>${esc(c)}</option>`).join("");
}
$("#curSel").onchange = e => {
  CUR = e.target.value;
  localStorage.setItem("environmsafe.currency", CUR);
  render();
};

/* ---------- login ---------- */

const SESSION_KEY = "environmsafe.session";

function chromeForUser() {
  const on = !!USER;
  $("#whoami").textContent = on ? `${USER.nameEn} · ${USER.role}` : "";
  $("#acctBtn").style.display = on ? "" : "none";
  $("#curSel").style.display = on ? "" : "none";
  $("#nav").style.display = on ? "" : "none";
  document.querySelector(".shell").classList.toggle("noauth", !on);
}

function loginScreen(message) {
  USER = null;
  chromeForUser();
  const m = $("#main"); m.innerHTML = "";
  const card = el("div", { class:"card", style:"max-width:26rem;margin:2rem auto" });
  card.innerHTML = `
    <div style="text-align:center;margin-bottom:1rem">
      ${CO().logo ? `<img src="${CO().logo}" alt="EnvironmSafe" style="max-width:220px;width:70%">`
                     : `<h2>EnvironmSafe</h2>`}
    </div>
    <h2>Sign in</h2>
    ${message ? `<p class="card-note" style="color:var(--s-crit)">${esc(message)}</p>` : ""}`;
  const form = el("form");
  form.appendChild(fld("Username | اسم المستخدم", `<input name="username" autocomplete="username" required>`));
  form.appendChild(fld("Password | كلمة المرور", `<input type="password" name="password" autocomplete="current-password" required>`));
  const btn = el("button", { class:"btn gold", type:"submit", style:"margin-top:.9rem;width:100%" }, "Sign in");
  form.appendChild(btn);
  form.onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form).entries());
    const u = userByName(f.username);
    if (!u || u.active === "No" || !(await checkPassword(u, f.password)))
      return loginScreen("Wrong username or password.");
    USER = u;
    sessionStorage.setItem(SESSION_KEY, u.id);
    chromeForUser();
    if (u.mustChange === "Yes") { render(); changePassword(true); }
    else { toast(`Welcome, ${u.nameEn}`); render(); }
  };
  card.appendChild(form);
  if (rowsOf("users").length === 1 && userByName(DEFAULT_ADMIN.username)?.mustChange === "Yes") {
    card.appendChild(el("p", { class:"card-note", style:"margin-top:1rem" },
      `First use: sign in as <b>${DEFAULT_ADMIN.username}</b> with the password
       <b>${DEFAULT_ADMIN.password}</b>, then change it immediately.`));
  }
  m.appendChild(card);
}

function accountMenu() {
  const bg = el("div", { class:"modal-bg" });
  const box = el("div", { class:"modal", style:"width:min(360px,100%)" });
  box.appendChild(el("h2", {}, esc(`${USER.nameEn} — ${USER.role}`)));
  box.appendChild(el("p", { class:"card-note" }, esc("Signed in as " + USER.username)));
  const wrap = el("div", { style:"display:flex;flex-direction:column;gap:.5rem;margin-top:.9rem" });
  const pw = el("button", { class:"btn ghost" }, "Change my password");
  pw.onclick = () => { bg.remove(); changePassword(false); };
  const out = el("button", { class:"btn" }, "Sign out");
  out.onclick = () => { sessionStorage.removeItem(SESSION_KEY); bg.remove(); loginScreen(); };
  const close = el("button", { class:"btn ghost" }, t("cancel"));
  close.onclick = () => bg.remove();
  wrap.appendChild(pw); wrap.appendChild(out); wrap.appendChild(close);
  box.appendChild(wrap);
  bg.appendChild(box);
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
}

function changePassword(forced) {
  const fields = [{ k:"p1", l:"New password", t:"password", req:true },
                  { k:"p2", l:"Repeat new password", t:"password", req:true }];
  if (!forced) fields.unshift({ k:"old", l:"Current password", t:"password", req:true });
  modal(forced ? "Choose your password" : "Change password", fields, async vals => {
    if (!forced && !(await checkPassword(USER, vals.old))) return toast("Current password is wrong.");
    if (vals.p1.length < 6) return toast("Use at least 6 characters.");
    if (vals.p1 !== vals.p2) return toast("The two passwords do not match.");
    await setPassword(USER, vals.p1);
    USER.mustChange = "No";
    save(); render(); toast("Password changed");
  });
}

/* ---------- boot ---------- */

(async () => {
  applyChrome();
  previewBanner();
  await ensureAdmin();
  save();
  const id = sessionStorage.getItem(SESSION_KEY);
  const u = id ? rowsOf("users").find(x => x.id === id) : null;
  if (u && u.active !== "No") {
    USER = u; chromeForUser();
    const v = viewFromHash(); if (v) VIEW = v;
    render();
  }
  else loginScreen();
})();
