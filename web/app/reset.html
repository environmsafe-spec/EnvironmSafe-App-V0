<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Set a new password — EnvironmSafe</title>
<style>
  :root {
    --ground:#F4F6F8; --surface:#FFFFFF;
    --ink:#131A2A; --ink-2:#3D4658; --muted:#5C6579; --line:#DFE3EA;
    --navy:#1A2744; --gold:#E8A317; --gold-ink:#5A3E00;
    --s-good:#1E7A4B; --s-crit:#B02020;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --shadow:0 1px 2px rgba(19,26,42,.06), 0 8px 24px rgba(19,26,42,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0D1220; --surface:#151D2E;
      --ink:#E8EBF1; --ink-2:#C3CAD8; --muted:#96A1B7; --line:#263148;
      --navy:#101827; --gold:#F2B23F; --gold-ink:#241800;
      --s-good:#4BBE85; --s-crit:#F08A8A;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.32);
    }
  }
  * { box-sizing:border-box }
  body {
    margin:0; padding:2rem 1rem calc(2rem + env(safe-area-inset-bottom, 0px));
    background:var(--ground); color:var(--ink); font:15px/1.6 var(--sans);
    display:flex; justify-content:center; align-items:flex-start; min-height:100vh;
  }
  .card {
    width:100%; max-width:26rem; background:var(--surface); border:1px solid var(--line);
    border-radius:.75rem; box-shadow:var(--shadow); padding:1.5rem;
  }
  h1 { margin:0 0 .25rem; font-size:1.25rem; color:var(--navy) }
  .ar { color:var(--muted); font-size:.95rem; margin:0 0 1.25rem }
  label { display:block; margin:1rem 0 .3rem; font-weight:600; font-size:.9rem; color:var(--ink-2) }
  input {
    width:100%; padding:.65rem .75rem; font:inherit; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:.4rem;
  }
  input:focus { outline:2px solid var(--gold); outline-offset:1px }
  button {
    width:100%; margin-top:1.25rem; padding:.7rem 1rem; font:inherit; font-weight:600;
    background:var(--gold); color:var(--gold-ink); border:0; border-radius:.4rem; cursor:pointer;
  }
  button:disabled { opacity:.55; cursor:default }
  .msg { margin-top:1rem; padding:.7rem .85rem; border-radius:.4rem; font-size:.9rem }
  .msg.bad  { background:color-mix(in srgb, var(--s-crit) 12%, transparent); color:var(--s-crit) }
  .msg.good { background:color-mix(in srgb, var(--s-good) 12%, transparent); color:var(--s-good) }
  .hint { margin-top:.4rem; font-size:.82rem; color:var(--muted) }
  a { color:var(--navy); font-weight:600 }
  @media (prefers-color-scheme: dark) { a { color:var(--gold) } }
</style>
</head>
<body>
<div class="card">
  <h1>Set a new password</h1>
  <p class="ar" dir="rtl">تعيين كلمة سر جديدة</p>

  <div id="form" hidden>
    <label for="pw">New password | كلمة السر الجديدة</label>
    <input type="password" id="pw" autocomplete="new-password" minlength="8">
    <label for="pw2">Repeat it | أعد كتابتها</label>
    <input type="password" id="pw2" autocomplete="new-password" minlength="8">
    <p class="hint">At least 8 characters. | ٨ أحرف على الأقل.</p>
    <button id="go">Save the new password</button>
  </div>

  <div id="msg" class="msg" hidden></div>
</div>

<script>
/* The recovery link from Supabase lands here carrying a short-lived access
   token. That token is only good for this one thing: naming a new password.
   Nothing else on this page reads or writes the books. */
const CLOUD = {
  url: "https://mcgjrsfsppdcnvolqsgs.supabase.co",
  key: "sb_publishable_R_5WX_WMMXZCkGnwfp6ZTw_dtUaq1qx"
};
const APP = "./index.html";

const form = document.getElementById("form");
const msgBox = document.getElementById("msg");

function say(text, kind) {
  msgBox.textContent = text;
  msgBox.className = "msg " + (kind || "");
  msgBox.hidden = false;
}

/* Supabase returns the token in the URL fragment, which never leaves the
   browser. Read it, then wipe it from the address bar so it cannot be
   shoulder-read or left behind in a shared history. */
function takeToken() {
  const hash = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  const query = new URLSearchParams(location.search);
  const error = hash.get("error_description") || query.get("error_description")
             || hash.get("error") || query.get("error");
  const token = hash.get("access_token");
  history.replaceState(null, "", location.pathname);
  return { token: token, error: error, type: hash.get("type") };
}

const arrival = takeToken();

if (arrival.error) {
  // Expired and already-used links both land here.
  say("This link is no longer valid — it has expired or was already used. "
    + "Ask for a new one from the app's Data page. "
    + "هذا الرابط لم يعد "
    + "صالحًا — اطلب رابطًا "
    + "جديدًا.", "bad");
} else if (!arrival.token) {
  say("Open this page from the link in the password email — it carries the "
    + "code that proves the account is yours. "
    + "افتح هذه الصفحة من "
    + "الرابط المرسل في "
    + "البريد.", "bad");
} else {
  form.hidden = false;
  document.getElementById("pw").focus();
}

document.getElementById("go").onclick = async function () {
  const btn = this;
  const pw = document.getElementById("pw").value;
  const pw2 = document.getElementById("pw2").value;

  if (pw.length < 8) return say("Use at least 8 characters. | استخدم ٨ أحرف على الأقل.", "bad");
  if (pw !== pw2)    return say("The two passwords are not the same. | كلمتا السر غير متطابقتين.", "bad");

  btn.disabled = true;
  btn.textContent = "Saving…";
  try {
    const r = await fetch(CLOUD.url + "/auth/v1/user", {
      method: "PUT",
      headers: {
        apikey: CLOUD.key,
        Authorization: "Bearer " + arrival.token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ password: pw })
    });
    const body = await r.json().catch(() => null);
    if (!r.ok) {
      const detail = (body && (body.error_description || body.msg || body.message)) || ("HTTP " + r.status);
      throw new Error(detail);
    }
    form.hidden = true;
    say("Password changed. Open the app, go to Data, and sign in with it. "
      + "تم تغيير كلمة السر.", "good");
    msgBox.insertAdjacentHTML("beforeend", ' <a href="' + APP + '">Open the app</a>');
  } catch (e) {
    const m = String(e && e.message || "");
    say(/Failed to fetch|NetworkError|Load failed/i.test(m)
      ? "Could not reach the cloud service. Check the connection and try again."
      : m || "Something went wrong.", "bad");
    btn.disabled = false;
    btn.textContent = "Save the new password";
  }
};
</script>
</body>
</html>
