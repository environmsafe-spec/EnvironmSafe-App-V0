name: Android APK

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the APKs to a GitHub release under this tag (blank = build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1"

      - name: Build debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             dist/EnvironmSafe-v0-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             dist/EnvironmSafe-v0-release-unsigned.apk
          # No-install fallback: the whole system as one file that opens in any
          # browser, for connections that cannot finish a large download.
          cp web/app/index.html dist/EnvironmSafe-System.html
          ls -lh dist

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EnvironmSafe-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One release per app version: a rebuild of the same versionName
          # replaces the attached APKs, so /releases/latest always serves the
          # newest build. Bumping versionName in app/build.gradle opens a new one.
          version=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle)
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            case "${GITHUB_REF}" in
              refs/tags/*) tag="${GITHUB_REF_NAME}" ;;
              *)           tag="v${version}" ;;
            esac
          fi
          notes="EnvironmSafe — Procurement & Financial Management System.

          \`EnvironmSafe-v0-debug.apk\` is the installable build: download it on an
          Android 9 (API 28) or newer device and allow installs from your browser.

          \`EnvironmSafe-System.html\` is the same system as a single file — open it
          in any browser, no installation. Use this if the APK download will not
          finish on a slow connection.

          \`EnvironmSafe-v0-release-unsigned.apk\` is unsigned and cannot be installed
          until it is signed with a release keystore.

          Built from ${GITHUB_SHA} by the Android APK workflow."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/EnvironmSafe-* --clobber
          else
            gh release create "$tag" dist/EnvironmSafe-* \
              --target "$GITHUB_SHA" \
              --title "EnvironmSafe V0 ($tag)" \
              --notes "$notes"
          fi
