plugins {
    id "com.android.application"
    id "kotlin-android"
}

// The system's screens live in /web/app so the website and the APK ship the
// exact same files. This copies them into the APK's assets at build time.
def webAssets = layout.buildDirectory.dir("generated/webassets")

tasks.register("copyWebApp", Copy) {
    from "$rootDir/web/app"
    into webAssets.get().asFile.toPath().resolve("app").toFile()
}

android {
    namespace "com.environmsafe.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.environmsafe.app"
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    sourceSets {
        main {
            assets.srcDirs += webAssets
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("Assets")) {
        task.dependsOn "copyWebApp"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.activity:activity-ktx:1.8.2"
    implementation "com.google.android.material:material:1.11.0"
}
