plugins {
    id "com.android.application"
    id "kotlin-android"
}

android {
    namespace "com.environmsafe.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.environmsafe.app"
        minSdk 28
        targetSdk 34
        versionCode 3
        versionName "1.1.1"
        resConfigs "en", "ar"
    }

    sourceSets {
        main {
            // The system's screens live in /web so the website and the APK ship the
            // exact same files: /web/app/index.html is packaged as assets/app/index.html.
            assets.srcDirs += "$rootDir/web"
        }
    }

    buildTypes {
        // Shrinking is applied to both builds: the installable APK is downloaded
        // over mobile connections, so every megabyte counts.
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/*.version", "META-INF/**.kotlin_module", "DebugProbesKt.bin",
                         "kotlin/**", "**/*.kotlin_builtins"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    // Deliberately minimal: the screens are HTML inside a WebView, so no UI
    // toolkit is needed beyond the activity host.
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.activity:activity-ktx:1.8.2"
}
